<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="ht-section-one">
                    <h1>Personal Library</h1>
                </div>
                <div class="ht-section-two">
                    <img src="./assets/magnify.svg" alt="search">
                    <img src="./assets/bell-badge.svg" alt="notifications">
                    <img src="./assets/account.svg" alt="account">
                    <span>Reader</span>
                </div>
            </div>
            <div class="header-bottom">
                <p> Welcome Back, Reader!</p>
                <button id="newBook-btn">Add Book</button>
            </div>
        </header>
        
        <dialog id="add-book-dialog">
           <form id="book-form">
              <fieldset>
                   <legend>Book Details</legend>
                   <div class="input-group">
                       <label for="title">Book Title</label>
                       <input type="text" id="title" name="title" required>
                   </div>
                   <div class="input-group">
                       <label for="author">Author</label>
                       <input type="text" id="author" name="author" required>
                   </div>
                   <div class="input-group">
                       <label for="pages">Pages</label>
                       <input type="number" id="pages" name="pages" required>
                   </div>
   
                   <p class="radio-label">Reading Status</p>
                    <div class="radio-wrapper">
                        <div>
                          <input type="radio" id="read" name="readingStatus" value="read">
                          <label for="read">Read</label>
                       </div>
                       <div>
                          <input type="radio" id="unread" name="readingStatus" value="unread" checked>
                          <label for="unread">Not Yet Read</label>
                       </div>
                    </div>
              </fieldset>
            <button type="submit">Add Book</button>
        </form>
        </dialog>
        <main class="content">
            <h2>Books</h2>
            <div id="Library-container"></div>
        </main>
   </div>
</body>
</html>
